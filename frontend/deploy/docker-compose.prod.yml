services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ro_graphique}
      POSTGRES_USER: ${POSTGRES_USER:-ro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ro_user} -d $${POSTGRES_DB:-ro_graphique}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/toussaint272/ro-graphique-backend:latest
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN:-https://localhost:5173}
      APP_ORIGIN_EXTRA: ${APP_ORIGIN_EXTRA:-http://localhost:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-ro_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ro_graphique}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/toussaint272/ro-graphique-frontend:latest
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: